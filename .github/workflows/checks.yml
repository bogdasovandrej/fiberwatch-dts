name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pandas==2.3.3 scikit-learn==1.7.2 matplotlib==3.10.6 joblib==1.6.0
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python fiberwatch.py --help
      - run: python -m py_compile tools/*.py history/*.py
